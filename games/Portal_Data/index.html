		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

		<style>
			body {
				font-family: arial;
				margin: 0;
				padding: 0;
				background: #000;
				overflow: hidden;
			}

			.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
			div.emscripten { text-align: center; }
			canvas.emscripten {
				border: 0px none;
				background-color: black;
				display: block;
				width: 100vw !important;
				height: 100vh !important;
			}
			div.emscripten_border {
				position: fixed;
				top: 0; left: 0;
				width: 100vw; height: 100vh;
				border: none !important;
				margin: 0; padding: 0;
			}
			#emscripten_logo, #spinner, #status, #controls, #progress, #output,
			div.emscripten:not(.emscripten_border) {
				position: fixed !important;
				left: -99999px !important;
				top: -99999px !important;
				pointer-events: none !important;
			}
			.spinner {
				height: 30px; width: 30px; display: block;
				animation: rotation 0.8s linear infinite;
				border-left: 5px solid rgb(70, 130, 200);
				border-right: 5px solid rgb(70, 130, 200);
				border-bottom: 5px solid rgb(70, 130, 200);
				border-top: 5px solid rgb(30, 60, 120);
				border-radius: 100%; 
				background-color: rgb(100, 150, 220);
			}
			#status { display: inline-block; font-weight: bold; color: rgb(100, 150, 220); }
			#progress { height: 20px; width: 300px; }
			#controls { display: inline-block; }
			#output { display: block; width: 100%; height: 200px; background: black; color: #4a8cff; font-family: "Lucida Console", Monaco, monospace; outline: none; }
			
			@keyframes rotation { 
				from { transform: rotate(0deg); } 
				to { transform: rotate(360deg); } 
			}
			@-webkit-keyframes rotation { 
				from { -webkit-transform: rotate(0deg); } 
				to { -webkit-transform: rotate(360deg); } 
			}

			#net-overlay {
				position: fixed;
				inset: 0;
				z-index: 99998;
				background: rgba(0,0,0,0.45);
				backdrop-filter: blur(6px);
				-webkit-backdrop-filter: blur(6px);
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.25s ease;
			}
			#net-overlay.active {
				opacity: 1;
				pointer-events: none;
			}

			#dl-panel {
				position: fixed;
				width: 360px;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(8,20,40,0.95);
				border: 1px solid rgba(74, 140, 255, 0.3);
				border-radius: 12px;
				box-shadow: 0 14px 48px rgba(0,0,0,0.85);
				font-family: 'Courier New', monospace;
				color: #bbddff;
				z-index: 99999;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.25s ease;
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
			}
			#dl-panel.active {
				opacity: 1;
				pointer-events: all;
			}

			#dl-titlebar {
				display: flex; 
				align-items: center; 
				gap: 7px;
				padding: 12px 15px;
				background: rgba(74, 140, 255, 0.1);
				border-bottom: 1px solid rgba(74, 140, 255, 0.2);
				border-radius: 12px 12px 0 0;
				cursor: grab; 
				user-select: none;
			}
			#dl-titlebar:active { cursor: grabbing; }
			.dl-dot { 
				width: 10px; 
				height: 10px; 
				border-radius: 50%; 
				background: rgba(74, 140, 255, 0.4); 
			}
			#dl-label {
				flex: 1; 
				font-size: 11px; 
				letter-spacing: 0.1em;
				text-transform: uppercase; 
				color: rgba(74, 140, 255, 0.8);
				font-weight: 600;
			}
			.dl-spin {
				width: 12px; 
				height: 12px;
				border: 2px solid rgba(74, 140, 255, 0.2);
				border-top-color: #4a9eff;
				border-radius: 50%;
				animation: rotation 0.7s linear infinite;
				flex-shrink: 0;
			}
			#dl-body {
				padding: 18px 18px 22px;
				display: flex; 
				flex-direction: column; 
				gap: 12px;
			}
			#dl-status {
				font-size: 12px; 
				color: #8ab5ff;
				white-space: nowrap; 
				overflow: hidden;

				background: rgba(74, 140, 255, 0.15);
				border-radius: 3px; 
				overflow: hidden;
			}
			#dl-bar {
				height: 100%; 
				width: 0%;
				background: linear-gradient(90deg, #1a5cc0, #4a9eff);
				border-radius: 3px; 
				transition: width 0.1s linear;
			}
			#dl-bar.cached {
				background: linear-gradient(90deg, #1580c4, #3ec1df);
			}
			#dl-meta { 
				display: flex; 
				justify-content: space-between; 
				align-items: baseline; 
			}
			#dl-pct {

				color: #6aafff; 
				letter-spacing: -0.03em; 
				line-height: 1; 
			}
			#dl-bytes { 
				font-size: 11px; 
				color: rgba(74, 140, 255, 0.5); 
				text-align: right; 
			}
			#dl-count {
				font-size: 10px; 
				color: rgba(74, 140, 255, 0.4);
				text-align: right; 
				margin-top: -4px;
			}

			@keyframes indeterminate {
				0%   { opacity: 0.3; width: 30%; margin-left: 0%; }
				50%  { opacity: 1;   width: 50%; margin-left: 25%; }

			}
		</style>

		<div id="net-overlay"></div>
		<div id="dl-panel">

				<div class="dl-dot"></div>
				<div class="dl-dot"></div>
				<span id="dl-label">Downloading</span>
				<div class="dl-spin"></div>
			</div>
			<div id="dl-body">
				<div id="dl-status">Fetching...</div>
				<div id="dl-track"><div id="dl-bar"></div></div>
				<div id="dl-meta">
					<span id="dl-pct">0%</span>
					<span id="dl-bytes"></span>
				</div>
				<div id="dl-count"></div>
			</div>
		</div>

		<script type="text/javascript">
		(function() {

			var overlay = document.getElementById("net-overlay");
			var dlPanel = document.getElementById("dl-panel");
			var dlBar = document.getElementById("dl-bar");
			var dlPct = document.getElementById("dl-pct");
			var dlBytes = document.getElementById("dl-bytes");
			var dlStatus = document.getElementById("dl-status");
			var dlLabel = document.getElementById("dl-label");
			var dlCount = document.getElementById("dl-count");

			var requests = {};
			var nextId = 0;
			var hideTimer = null;
			var posResolved = false;

			var DB_NAME = "hl2-asset-cache";
			var STORE_NAME = "files";
			var dbReady = null;

			function openDB() {
				if (dbReady) return dbReady;
				dbReady = new Promise(function(resolve, reject) {
					var req = indexedDB.open(DB_NAME, 1);
					req.onupgradeneeded = function(e) {
						var db = e.target.result;
						if (!db.objectStoreNames.contains(STORE_NAME)) {
							db.createObjectStore(STORE_NAME);
						}
					};
					req.onsuccess = function(e) { resolve(e.target.result); };
					req.onerror = function(e) { 
						console.warn("[Cache] IndexedDB failed:", e); 
						resolve(null); 
					};
				});
				
				if (navigator.storage && navigator.storage.persist) {
					navigator.storage.persist().then(function(granted) {
						console.log("[Cache] Persistent storage:", granted ? "granted" : "denied");
					});
				}
				return dbReady;
			}

			function isCacheable(url) {
				if (!url) return false;
				var clean = url.split("?")[0].split("#")[0].toLowerCase();
				return clean.endsWith(".data") || clean.endsWith(".dat") || clean.includes(".data");
			}

			function cacheKey(url) {
				try { 
					return new URL(url, location.href).pathname; 
				} catch(e) { 
					return url.split("?")[0]; 
				}
			}

			function cacheGet(key) {
				return openDB().then(function(db) {
					if (!db) return null;
					return new Promise(function(resolve) {
						try {
							var tx = db.transaction(STORE_NAME, "readonly");
							var req = tx.objectStore(STORE_NAME).get(key);
							req.onsuccess = function() { resolve(req.result || null); };
							req.onerror = function() { resolve(null); };
						} catch(e) { resolve(null); }
					});
				});
			}

			function cachePut(key, blob) {
				return openDB().then(function(db) {
					if (!db) return;
					return new Promise(function(resolve) {
						try {
							var tx = db.transaction(STORE_NAME, "readwrite");
							tx.objectStore(STORE_NAME).put(blob, key);
							tx.oncomplete = function() { 
								console.log("[Cache] Stored:", key, fmtBytes(blob.size)); 
								resolve(); 
							};
							tx.onerror = function() { 
								console.warn("[Cache] Write failed:", key); 
								resolve(); 
							};
						} catch(e) { resolve(); }
					});
				});
			}

			function fmtBytes(b) {
				if (!b || isNaN(b) || b < 0) return "";
				b = Math.round(b);
				if (b < 1024) return b + " B";
				if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
				if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
				return (b / 1073741824).toFixed(2) + " GB";
			}

			function shortUrl(url) {
				try {
					var u = (typeof url === "string") ? url : String(url);
					return u.split("?")[0].split("/").pop() || u;
				} catch(e) { return ""; }
			}

			function updateUI() {
				var ids = Object.keys(requests);
				var active = ids.length;

				if (active === 0) {
					if (hideTimer === null) {
						hideTimer = setTimeout(function() {
							overlay.classList.remove("active");
							dlPanel.classList.remove("active");
							hideTimer = null;
						}, 600);
					}
					return;
				}

				if (hideTimer !== null) {
					clearTimeout(hideTimer);
					hideTimer = null;
				}
				
				overlay.classList.add("active");
				dlPanel.classList.add("active");

				var totalLoaded = 0, totalSize = 0, hasTotal = false;
				var cacheCount = 0;
				
				for (var i = 0; i < ids.length; i++) {
					var r = requests[ids[i]];
					totalLoaded += r.loaded || 0;
					if (r.total > 0) { 
						totalSize += r.total; 
						hasTotal = true; 
					}
					if (r.cached) cacheCount++;
				}

				if (cacheCount > 0 && cacheCount === active) {
					dlLabel.textContent = "Loading from cache";
					dlBar.classList.add("cached");
				} else if (cacheCount > 0) {
					dlLabel.textContent = "Downloading + cache";
					dlBar.classList.remove("cached");
				} else {
					dlLabel.textContent = active > 1 ? "Downloading files" : "Downloading";
					dlBar.classList.remove("cached");
				}

				if (cacheCount > 0 && cacheCount === active) {
					dlStatus.textContent = active > 1 ? active + " files — loading from cache" : "Loading from cache...";
				} else {
					dlStatus.textContent = active > 1 ? active + " files downloading..." : "Fetching game assets...";
				}

				dlCount.textContent = active > 1 ? active + " active" : "";

				if (hasTotal && totalSize > 0) {
					var pct = Math.min(100, Math.floor((totalLoaded / totalSize) * 100));
					dlBar.style.width = pct + "%";
					dlBar.style.animation = "none";
					dlPct.textContent = pct + "%";
					dlBytes.textContent = fmtBytes(totalLoaded) + " / " + fmtBytes(totalSize);
				} else if (totalLoaded > 0) {
					dlBar.style.width = "100%";
					dlBar.style.animation = "indeterminate 1.5s ease-in-out infinite";
					dlPct.textContent = fmtBytes(totalLoaded);
					dlBytes.textContent = "downloading...";
				} else {
					dlBar.style.width = "100%";
					dlBar.style.animation = "indeterminate 1.5s ease-in-out infinite";
					dlPct.textContent = "—";
					dlBytes.textContent = "";
				}
			}

			function addRequest(name, cached) {
				var id = nextId++;
				requests[id] = { loaded: 0, total: 0, name: name, cached: !!cached };
				updateUI();
				return id;
			}

			function updateRequest(id, loaded, total) {
				if (requests[id] === undefined) return;
				requests[id].loaded = loaded || 0;
				requests[id].total = total || 0;
				updateUI();
			}

			function removeRequest(id) {
				delete requests[id];
				updateUI();
			}


			(function() {
				var tb = document.getElementById("dl-titlebar");
				var dragging = false, smx, smy, sl, st;
				function resolve() {
					var r = dlPanel.getBoundingClientRect();
					dlPanel.style.transform = "none";
					dlPanel.style.left = r.left + "px";
					dlPanel.style.top = r.top + "px";
					posResolved = true;
				}
				if (tb) {
					tb.addEventListener("mousedown", function(e) {
						if (!posResolved) resolve();
						dragging = true;
						smx = e.clientX; 
						smy = e.clientY;
						var r = dlPanel.getBoundingClientRect();
						sl = r.left; 
						st = r.top;
						e.preventDefault();
					});
					document.addEventListener("mousemove", function(e) {
						if (!dragging) return;
						dlPanel.style.left = (sl + e.clientX - smx) + "px";
						dlPanel.style.top = (st + e.clientY - smy) + "px";
					});
					document.addEventListener("mouseup", function() { dragging = false; });
				}
			})();

			// intercept fetch
			var origFetch = window.fetch;
			window.fetch = function(input, init) {
				var url = (input && input.url) ? input.url : String(input);
				var name = shortUrl(url);

				if (!isCacheable(url)) {
					var id = addRequest(name);
					return origFetch.apply(this, arguments).then(function(response) {
						var contentLength = response.headers.get("content-length");
						var total = contentLength ? parseInt(contentLength, 10) : 0;
						if (response.body && typeof response.body.getReader === "function") {
							var loaded = 0;
							var reader = response.body.getReader();
							var stream = new ReadableStream({
								start: function(controller) {
									function pump() {
										return reader.read().then(function(ref) {
											if (ref.done) {
												var ft = total > 0 ? total : loaded;
												updateRequest(id, ft, ft);
												setTimeout(function() { removeRequest(id); }, 100);
												controller.close();
												return;
											}
											loaded += ref.value.byteLength;
											updateRequest(id, loaded, total);
											controller.enqueue(ref.value);
											return pump();
										}).catch(function(err) { 
											removeRequest(id); 
											controller.error(err); 
										});
									}
									return pump();
								}
							});
							return new Response(stream, { 
								headers: response.headers, 
								status: response.status, 
								statusText: response.statusText 
							});
						} else {
							removeRequest(id);
							return response;
						}
					}).catch(function(err) { 
						removeRequest(id); 
						throw err; 
					});
				}

				// cacheable file
				var key = cacheKey(url);
				return cacheGet(key).then(function(cachedBlob) {
					if (cachedBlob) {
						console.log("[Cache] HIT:", name, fmtBytes(cachedBlob.size));
						var cid = addRequest(name, true);
						var total = cachedBlob.size;
						updateRequest(cid, total, total);
						
						return new Promise(function(resolve) {
							setTimeout(function() {
								removeRequest(cid);
								resolve(new Response(cachedBlob, {
									status: 200,
									statusText: "OK (cached)",
									headers: { 
										"Content-Type": "application/octet-stream", 
										"Content-Length": total,
										"X-Cache": "HIT"
									}
								}));
							}, 50);
						});
					}

					console.log("[Cache] MISS:", name, "- downloading");
					var id = addRequest(name);
					return origFetch.apply(null, [input, init]).then(function(response) {
						var contentLength = response.headers.get("content-length");
						var total = contentLength ? parseInt(contentLength, 10) : 0;
						if (response.body && typeof response.body.getReader === "function") {
							var chunks = [];
							var loaded = 0;
							var reader = response.body.getReader();
							var stream = new ReadableStream({
								start: function(controller) {
									function pump() {
										return reader.read().then(function(ref) {
											if (ref.done) {
												var ft = total > 0 ? total : loaded;
												updateRequest(id, ft, ft);
												setTimeout(function() { removeRequest(id); }, 100);
												controller.close();
												
												var blob = new Blob(chunks);
												cachePut(key, blob);
												return;
											}
											loaded += ref.value.byteLength;
											chunks.push(ref.value.slice(0));
											updateRequest(id, loaded, total);
											controller.enqueue(ref.value);
											return pump();
										}).catch(function(err) { 
											removeRequest(id); 
											controller.error(err); 
										});
									}
									return pump();
								}
							});
							return new Response(stream, { 
								headers: response.headers, 
								status: response.status, 
								statusText: response.statusText 
							});
						} else {
							removeRequest(id);
							return response;
						}
					}).catch(function(err) { 
						removeRequest(id); 
						throw err; 
					});
				});
			};

			// intercept XMLHttpRequest
			var OrigXHR = window.XMLHttpRequest;
			window.XMLHttpRequest = function() {
				var xhr = new OrigXHR();
				var id = null;
				var xhrName = "";
				var xhrUrl = "";

				var origOpen = xhr.open.bind(xhr);
				xhr.open = function(method, url) {
					xhrName = shortUrl(url);
					xhrUrl = url;
					return origOpen.apply(xhr, arguments);
				};

				var origSend = xhr.send.bind(xhr);
				xhr.send = function() {
					if (!isCacheable(xhrUrl)) {
						id = addRequest(xhrName);
						xhr.addEventListener("progress", function(e) {
							if (id !== null) {
								updateRequest(id, e.loaded, e.lengthComputable ? e.total : 0);
							}
						});
						xhr.addEventListener("load", function() {
							if (id !== null) {
								var size = 0;
								try {
									if (xhr.response instanceof ArrayBuffer) size = xhr.response.byteLength;
									else if (xhr.response instanceof Blob) size = xhr.response.size;
									else if (typeof xhr.responseText === "string") size = xhr.responseText.length;
								} catch(e) {}
								if (!size && xhr.getResponseHeader("content-length")) {
									size = parseInt(xhr.getResponseHeader("content-length"), 10);
								}
								if (size > 0) {
									updateRequest(id, size, size);
								}
								setTimeout(function() { 
									if (id !== null) removeRequest(id); 
									id = null;
								}, 50);
							}
						});
						xhr.addEventListener("error", function() { if (id !== null) { removeRequest(id); id = null; } });
						xhr.addEventListener("abort", function() { if (id !== null) { removeRequest(id); id = null; } });
						return origSend.apply(xhr, arguments);
					}

					var key = cacheKey(xhrUrl);
					cacheGet(key).then(function(cachedBlob) {
						if (cachedBlob) {
							console.log("[Cache] XHR HIT:", xhrName, fmtBytes(cachedBlob.size));
							var cid = addRequest(xhrName, true);
							updateRequest(cid, cachedBlob.size, cachedBlob.size);
							
							cachedBlob.arrayBuffer().then(function(ab) {
								removeRequest(cid);
								
								Object.defineProperty(xhr, "readyState", { get: function() { return 4; } });
								Object.defineProperty(xhr, "status", { get: function() { return 200; } });
								Object.defineProperty(xhr, "statusText", { get: function() { return "OK (cached)"; } });
								Object.defineProperty(xhr, "response", { get: function() { return ab; } });
								Object.defineProperty(xhr, "responseText", { get: function() { 
									try {
										var decoder = new TextDecoder();
										return decoder.decode(ab);
									} catch(e) { return ""; }
								}});
								
								if (xhr.readyState !== 4) {
									xhr.dispatchEvent(new Event("readystatechange"));
								}
								xhr.dispatchEvent(new ProgressEvent("progress", { 
									loaded: ab.byteLength, 
									total: ab.byteLength, 
									lengthComputable: true 
								}));
								xhr.dispatchEvent(new Event("load"));
								xhr.dispatchEvent(new Event("loadend"));
							});
							return;
						}

						console.log("[Cache] XHR MISS:", xhrName, "- downloading");
						id = addRequest(xhrName);
						xhr.addEventListener("progress", function(e) {
							if (id !== null) {
								updateRequest(id, e.loaded, e.lengthComputable ? e.total : 0);
							}
						});
						xhr.addEventListener("load", function() {
							if (id !== null) {
								var size = 0;
								var responseData = null;
								try {
									if (xhr.response instanceof ArrayBuffer) {
										size = xhr.response.byteLength;
										responseData = new Blob([xhr.response]);
									} else if (xhr.response instanceof Blob) {
										size = xhr.response.size;
										responseData = xhr.response;
									}
								} catch(e) {}
								if (!size && xhr.getResponseHeader("content-length")) {
									size = parseInt(xhr.getResponseHeader("content-length"), 10);
								}
								if (size > 0) {
									updateRequest(id, size, size);
									if (responseData) {
										cachePut(key, responseData);
									}
								}
								setTimeout(function() {
									if (id !== null) removeRequest(id);
									id = null;
								}, 50);
							}
						});
						xhr.addEventListener("error", function() { if (id !== null) { removeRequest(id); id = null; } });
						xhr.addEventListener("abort", function() { if (id !== null) { removeRequest(id); id = null; } });
						origSend.apply(xhr, arguments);
					});
				};
				return xhr;
			};
			

			for (var k in OrigXHR) {
				try { window.XMLHttpRequest[k] = OrigXHR[k]; } catch(e) {}
			}
			window.XMLHttpRequest.prototype = OrigXHR.prototype;


			openDB();
		})();
		</script>

		<script type="text/javascript">

			var statusElement = document.getElementById("status");
			var progressElement = document.getElementById("progress");
			var spinnerElement = document.getElementById("spinner");
			var canvasElement = document.getElementById("canvas");
			var outputElement = document.getElementById("output");
			
			if (outputElement) outputElement.value = "";

			canvasElement.addEventListener("webglcontextlost", function(e) {
				console.warn("WebGL context lost");
				e.preventDefault();
			}, false);

			canvasElement.widthNative = screen.availWidth;
			canvasElement.heightNative = screen.availHeight;

			var Module = {
				print: function() {
					var args = Array.prototype.slice.call(arguments);
					console.log.apply(console, args);
					if (outputElement) {
						outputElement.value += args.join(" ") + "\n";
						outputElement.scrollTop = outputElement.scrollHeight;
					}
				},
				printErr: function() {
					var args = Array.prototype.slice.call(arguments);
					console.error.apply(console, args);
					if (outputElement) {
						outputElement.value += "[ERROR] " + args.join(" ") + "\n";
						outputElement.scrollTop = outputElement.scrollHeight;
					}
				},
				canvas: canvasElement,
				setStatus: function(text) {
					if (!Module.setStatus.last) {
						Module.setStatus.last = { time: Date.now(), text: "" };
					}
					if (text === Module.setStatus.last.text) return;
					
					var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
					var now = Date.now();
					
					if (m && now - Module.setStatus.last.time < 30) return;
					
					Module.setStatus.last.time = now;
					Module.setStatus.last.text = text;
					
					if (m) {
						progressElement.value = parseInt(m[2]) * 100;
						progressElement.max = parseInt(m[4]) * 100;
						progressElement.hidden = false;
						spinnerElement.hidden = false;
					} else {
						progressElement.value = null;
						progressElement.max = null;
						progressElement.hidden = true;
						if (!text) spinnerElement.style.display = "none";
					}
					statusElement.innerHTML = text || "Ready";
				},
				totalDependencies: 0,
				monitorRunDependencies: function(left) {
					this.totalDependencies = Math.max(this.totalDependencies, left);
					Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
				}
			};
			
			Module.setStatus("Downloading...");
			
			window.onerror = function(message, source, lineno, colno, error) {
				Module.setStatus("Exception thrown: " + message);
				spinnerElement.style.display = "none";
				console.error("Game error:", message, source, lineno, colno, error);
				return false;
			};
		</script>

        });
