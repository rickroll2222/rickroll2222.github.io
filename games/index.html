<!DOCTYPE html>
<html lang="en">
<head>
    <title>games</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Styles and Icons -->
    <link rel="stylesheet" href="../style.css">
    <link rel="canonical" href="https://simplepwa.com" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="./mstile-144x144.png">
    <meta name="msapplication-config" content="./browserconfig.xml">
    <meta name="theme-color" content="#000000">

    <!-- Scripts -->
    <script src="/background.js"></script>
</head>
<script>
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
       var projects = JSON.parse(xhttp.responseText);
	   var index = document.getElementById("games")
	   index.innerHTML = "";
	   
	   projects.forEach((project) => {
		   var downloadElem = document.createElement("a");
		   downloadElem.href = project.hosted;
		   downloadElem.target = "_blank";
		   
		   var divElem = document.createElement("div");
		   divElem.classList.add("games");
		   

		   var nameElem = document.createElement("div");
      nameElem.classList.add("games_name");
		   nameElem.innerText = project.name;

		   
		   divElem.appendChild(nameElem);
		   downloadElem.appendChild(divElem);
		   index.appendChild(downloadElem);
		   

	   })
    }
};
xhttp.open("GET", "https://cdn.jsdelivr.net/gh/rickroll2222/rickroll2222.github.io@main/games.json", true);
xhttp.send();
  </script>

<body>
    <div class="container">
        <a href="../index.html"><span style="color:#1F51FF;">back</span></a>
        		<div id="games">
			<p>Loading</p>
		</div>

    </div>
</body>
</html>
